name: Android-APK bauen

# Baut die Debug-APK automatisch und stellt sie als Download bereit.
# Manuell startbar (Actions-Tab -> "Run workflow") oder bei Push auf die App.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK vorbereiten (vorinstalliert auf dem Runner)
        run: |
          SDK="$ANDROID_SDK_ROOT"
          [ -z "$SDK" ] && SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Debug-APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: NalasWaldschule-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
