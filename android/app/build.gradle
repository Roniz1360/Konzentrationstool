plugins {
    id 'com.android.application'
}

// Signatur-Angaben aus keystore.properties lesen (nicht im Repo).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'ch.waldschule.nala'
    compileSdk 35

    defaultConfig {
        applicationId 'ch.waldschule.nala'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey('storeFile')) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Nur signieren, wenn ein Keystore vorhanden ist (sonst normaler Debug-Testbau möglich).
            if (keystoreProps.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
